  { cat: "중요성 및 효과성", text: "이 사업은 시민의 문제나 욕구 해결에 효과적이다" },
];

const CHECKLISTS = {
  "gyeolgwa:monitor": {
    scale: SCALE_SANG,
    items: ["예산집행율", "성과목표(달성율)", "사업추진과정의 충실성", "우수사업 대상으로 적절성", "지속 추진 필요성", "구민 복지체감도 달성도"],
    texts: ["전반적인 사업에 대한 평가(총평)"],
  },
};

function Pill({ children, color }) {
  return <span className="inline-block px-2 py-0.5 rounded-full text-xs font-semibold" style={{ background: `${color}1A`, color }}>{children}</span>;
}
function Field({ label, children, note }) {
  return (
    <div className="mb-4">
      <label className="block text-sm font-semibold mb-1.5" style={{ color: C.ink }}>{label}</label>
      {note ? <p className="text-xs mb-1.5" style={{ color: C.muted }}>{note}</p> : null}
      {children}
    </div>
  );
}
function TA({ value, onChange, disabled, rows = 2, placeholder }) {
  return <textarea rows={rows} value={value || ""} placeholder={placeholder} disabled={disabled}
    onChange={(e) => onChange(e.target.value)} className="w-full rounded-md px-3 py-2 text-sm"
    style={{ border: `1px solid ${C.line}`, background: disabled ? "#F3F1EA" : "#fff", color: C.ink, resize: "vertical" }} />;
}
function IN({ value, onChange, disabled, placeholder, type = "text", w }) {
  return <input type={type} value={value ?? ""} placeholder={placeholder} disabled={disabled}
    onChange={(e) => onChange(e.target.value)} className="rounded-md px-2.5 py-1.5 text-sm"
    style={{ border: `1px solid ${C.line}`, background: disabled ? "#F3F1EA" : "#fff", color: C.ink, width: w || "100%" }} />;
}
function Segment({ scale, value, onChange, disabled }) {
  return (
    <div className="flex flex-wrap gap-1.5">
      {scale.map((s) => {
        const on = value === s.v;
        return <button key={s.v} disabled={disabled} onClick={() => onChange(on ? null : s.v)}
          className="px-3 py-1.5 rounded-md text-sm font-medium flex-1 text-center" title={s.hint || ""}
          style={{ minWidth: 60, border: `1px solid ${on ? C.pine : C.line}`, background: on ? C.pine : C.surface, color: on ? "#fff" : C.ink, opacity: disabled ? 0.5 : 1, cursor: disabled ? "not-allowed" : "pointer" }}>
          {s.l}{s.hint ? <span className="block text-[10px] font-normal opacity-85">{s.hint}</span> : null}
        </button>;
      })}
    </div>
  );
}
function SectionLabel({ n, t }) {
  return (
    <div className="flex items-center gap-2 mt-6 mb-3 pb-1.5" style={{ borderBottom: `2px solid ${C.pineSoft}` }}>
      <span className="text-base font-bold" style={{ color: C.pine }}>{n}</span>
      <h4 className="text-base font-bold" style={{ color: C.ink }}>{t}</h4>
    </div>
  );
}
function Note({ children }) {
  return <div className="px-4 py-3 rounded-md text-sm" style={{ background: C.pineSoft, color: C.pineDark }}>{children}</div>;
}
function BackBtn({ onClick }) {
  return <button onClick={onClick} className="text-sm font-semibold mb-3" style={{ color: C.pine }}>← 사업 목록</button>;
}

const pct = (num, den) => {
  const n = parseFloat(num), d = parseFloat(den);
  return d > 0 && !isNaN(n) ? ((n / d) * 100) : null;
};
const pctColor = (v) => v == null ? C.muted : v >= 90 ? C.ok : v >= 70 ? C.warn : C.bad;

function LoginScreen({ onLogin }) {
  const [selRole, setSelRole] = useState("gonggong");
  const [pwd, setPwd] = useState("");
  
  const handleLogin = () => {

    if (pwd === pwds[selRole]) {

      alert("비밀번호가 일치하지 않습니다.");

  return (
    <div className="flex flex-col items-center justify-center min-h-screen" style={{ background: C.pineDark, fontFamily: "'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif" }}>
      <div className="p-8 bg-white rounded-lg shadow-xl w-full max-w-sm flex flex-col gap-5">
        <div className="text-center">
          <div className="text-xs font-semibold mb-1" style={{ color: C.pine }}>대구광역시 제5기 지역사회보장계획</div>
          <h1 className="text-xl font-bold" style={{ color: C.ink }}>온라인 모니터링 시스템</h1>

            <select value={selRole} onChange={(e) => setSelRole(e.target.value)} className="w-full p-2.5 border rounded-md text-sm outline-none" style={{ borderColor: C.line }}>
              {ROLES.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}

          <div>
            <label className="block text-sm font-semibold mb-1.5" style={{ color: C.ink }}>비밀번호</label>
            <input type="password" value={pwd} onChange={(e) => setPwd(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleLogin()} className="w-full p-2.5 border rounded-md text-sm outline-none" style={{ borderColor: C.line }} placeholder="비밀번호를 입력하세요" />
          </div>
          <button onClick={handleLogin} className="w-full py-2.5 mt-2 rounded-md text-white font-bold transition-colors" style={{ background: C.pine }}>

        </div>
      </div>
    </div>
  );
}

function SummaryDashboard({ projects, evals, onOpen }) {
  const [type, setType] = useState("ihaeng");

  const sysStats = useMemo(() => {
    let total = projects.length;
    let submitted = 0;
    let sumAch = 0, cntAch = 0;
    let sumBdg = 0, sumSpd = 0;
    let distA = { h:0, m:0, l:0, n:0 };
    let distB = { h:0, m:0, l:0, n:0, nb:0 };
    let att = [];
    let stg = {};
    
    projects.forEach(p => {
      let gData = evals[`${p.id}::${type}::gonggong::gonggong`];
      let has = !!gData;
      if (has) submitted++;
      
      let stKey = p.num.split('-').slice(0, 2).join('-');
      let stName = STRATEGY_NAMES[stKey] || (`추진전략 ${stKey}`);
      if (!stg[stKey]) stg[stKey] = { id: stKey, name: stName, cnt:0, sub:0, aS:0, aC:0, bS:0, sS:0 };
      stg[stKey].cnt++;
      if(has) stg[stKey].sub++;
      
      let aR = null;
      let goal = parseFloat(p.goal);
      if (has && !isNaN(goal) && goal > 0) {
        let r = parseFloat(gData.result);
        if (!isNaN(r)) {
          aR = (r/goal)*100;
          sumAch += Math.min(aR, 100);
          cntAch++;
          stg[stKey].aS += Math.min(aR, 100);
          stg[stKey].aC++;
        }
      }
      
      let bR = null;
      let nb = p.budget === "비예산" || !p.budget || p.budget == "0" || p.budget == 0;
      if (!nb) {
        let bdg = parseFloat(p.budget);
        sumBdg += bdg;
        stg[stKey].bS += bdg;
        if (has) {
          let spd = parseFloat(gData.spend);
          if (!isNaN(spd)) {
            bR = (spd/bdg)*100;
            sumSpd += spd;
            stg[stKey].sS += spd;
          }
        }
      }
      
      if (!has || aR === null) distA.n++;
      else if (aR >= 90) distA.h++;
      else if (aR >= 70) distA.m++;
      else distA.l++;
      
      if (nb) distB.nb++;
      else if (!has || bR === null) distB.n++;
      else if (bR >= 90) distB.h++;
      else if (bR >= 70) distB.m++;
      else distB.l++;
      
      if (has && ((aR !== null && aR < 70) || (bR !== null && bR < 70))) {
        att.push({ ...p, aR, bR });
      }
    });
    
    const sortedStg = Object.values(stg).sort((a,b) => a.id.localeCompare(b.id));
    return { total, submitted, avgA: cntAch?sumAch/cntAch:0, sumBdg, sumSpd, avgB: sumBdg? (sumSpd/sumBdg)*100 : 0, distA, distB, att, stg: sortedStg };
  }, [projects, evals, type]);
  
  const nEval = Object.keys(evals).filter(k => k.includes(`::${type}::`) && !k.includes("gonggong::gonggong")).length;
  const Bar = ({ w, c }) => <div className="h-3 rounded-full" style={{ width: `${Math.min(w,100)}%`, background: c }}></div>;
  
  return (
    <div className="flex flex-col gap-5">
      <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-2 gap-3">
        <div>
          <h2 className="text-2xl font-bold mb-1.5" style={{ color: C.ink }}>종합 대시보드</h2>
          <p className="text-sm" style={{ color: C.muted }}>대구광역시 지역사회보장계획 · {type==='ihaeng' ? '이행점검' : '결과확인'} 현황</p>
        </div>
        <div className="flex border rounded-md overflow-hidden" style={{ borderColor: C.line }}>
          <button onClick={()=>setType('ihaeng')} className={`px-4 py-2 text-sm font-bold transition-colors ${type==='ihaeng' ? 'bg-[#22574A] text-white' : 'bg-white text-[#6B7169]'}`}>이행점검</button>
          <button onClick={()=>setType('gyeolgwa')} className={`px-4 py-2 text-sm font-bold transition-colors ${type==='gyeolgwa' ? 'bg-[#22574A] text-white' : 'bg-white text-[#6B7169]'}`}>결과확인</button>
        </div>
      </div>
      
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
        <div className="p-4 rounded-lg border bg-white shadow-sm flex flex-col justify-center" style={{ borderColor: C.line }}>
          <div className="text-xs font-semibold mb-1" style={{ color: C.muted }}>세부사업</div>
          <div className="text-2xl font-bold" style={{ color: C.ink }}>{sysStats.total}개</div>
        </div>
        <div className="p-4 rounded-lg border bg-white shadow-sm flex flex-col justify-center" style={{ borderColor: C.line }}>
          <div className="text-xs font-semibold mb-1" style={{ color: C.muted }}>공공 점검자료 제출</div>
          <div className="text-2xl font-bold" style={{ color: '#005BAA' }}>{sysStats.submitted}<span className="text-base text-[#6B7169]">/{sysStats.total}</span></div>
          <div className="text-[11px] mt-1 text-[#6B7169]">{Math.round((sysStats.submitted/sysStats.total)*100||0)}% 완료</div>
        </div>
        <div className="p-4 rounded-lg border bg-white shadow-sm flex flex-col justify-center" style={{ borderColor: C.line }}>
          <div className="text-xs font-semibold mb-1" style={{ color: C.muted }}>평균 목표달성률</div>
          <div className="text-2xl font-bold" style={{ color: '#B8860B' }}>{sysStats.avgA.toFixed(1)}%</div>
          <div className="text-[11px] mt-1 text-[#6B7169]">100% 초과분은 100%로 산정</div>
        </div>
        <div className="p-4 rounded-lg border bg-white shadow-sm flex flex-col justify-center" style={{ borderColor: C.line }}>
          <div className="text-xs font-semibold mb-1" style={{ color: C.muted }}>예산집행률(총액)</div>
          <div className="text-2xl font-bold" style={{ color: '#B8860B' }}>{sysStats.avgB.toFixed(1)}%</div>
          <div className="text-[11px] mt-1 text-[#6B7169]">예산 {sysStats.sumBdg.toLocaleString()} · 집행 {sysStats.sumSpd.toLocaleString()} 백만원</div>
        </div>
        <div className="p-4 rounded-lg border bg-white shadow-sm flex flex-col justify-center" style={{ borderColor: C.line }}>
          <div className="text-xs font-semibold mb-1" style={{ color: C.muted }}>모니터링단 평가</div>
          <div className="text-2xl font-bold" style={{ color: C.ink }}>{nEval}건</div>
        </div>
      </div>
      
      <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
        <div className="col-span-1 md:col-span-2 p-5 rounded-lg border bg-white shadow-sm" style={{ borderColor: C.line }}>
          <div className="flex justify-between items-end mb-4">
            <h3 className="font-bold text-sm" style={{ color: C.ink }}>추진전략 단위별 목표달성률·예산집행률</h3>
            <div className="flex gap-3 text-xs" style={{ color: C.muted }}>
              <span className="flex items-center gap-1"><div className="w-2.5 h-2.5 rounded-sm bg-[#22574A]"></div>달성률</span>
              <span className="flex items-center gap-1"><div className="w-2.5 h-2.5 rounded-sm bg-[#4A88A8]"></div>집행률</span>
            </div>
          </div>
          <div className="flex flex-col gap-6 mt-2">
            {sysStats.stg.map(s => {
              let aR = s.aC ? s.aS/s.aC : 0;
              let bR = s.bS ? (s.sS/s.bS)*100 : 0;
              return (
                <div key={s.id}>
                  <div className="flex justify-between items-end mb-2">
                    <div className="text-sm font-bold" style={{ color: C.ink }}>
                      <span className="px-1.5 py-0.5 rounded text-white text-xs mr-1.5 bg-[#22574A]">{s.id}</span>
                      {s.name}
                    </div>
                    <div className="text-xs" style={{ color: C.muted }}>사업 {s.cnt} · 제출 {s.sub}</div>
                  </div>
                  <div className="flex flex-col gap-1.5">
                    <div className="flex items-center gap-3">
                      <div className="flex-1 bg-gray-100 h-3 rounded-full overflow-hidden"><Bar w={aR} c="#22574A" /></div>
                      <div className="w-10 text-right text-xs font-bold" style={{ color: "#22574A" }}>{aR.toFixed(1)}%</div>
                    </div>
                    <div className="flex items-center gap-3">
                      <div className="flex-1 bg-gray-100 h-3 rounded-full overflow-hidden"><Bar w={bR} c="#4A88A8" /></div>
                      <div className="w-10 text-right text-xs font-bold" style={{ color: "#4A88A8" }}>{bR.toFixed(1)}%</div>
                    </div>
                  </div>
                </div>
              )
            })}
          </div>
        </div>
        
        <div className="col-span-1 flex flex-col gap-5">
          <div className="p-4 rounded-lg border bg-white shadow-sm" style={{ borderColor: C.line }}>
            <h3 className="font-bold text-sm mb-4" style={{ color: C.ink }}>목표달성률 분포</h3>
            <div className="flex flex-col gap-2.5 text-xs">
              {[
                { l: '90% 이상', v: sysStats.distA.h, c: '#22574A' },
                { l: '70~90%', v: sysStats.distA.m, c: '#C49A29' },
                { l: '70% 미만', v: sysStats.distA.l, c: '#C34B36' },
                { l: '미제출', v: sysStats.distA.n, c: '#9FA69E' }
              ].map(row => (
                <div key={row.l} className="flex items-center gap-2">
                  <div className="w-16" style={{ color: C.muted }}>{row.l}</div>
                  <div className="flex-1 bg-gray-100 h-2.5 rounded-full overflow-hidden"><div className="h-full rounded-full transition-all" style={{ width:`${(row.v/sysStats.total)*100}%`, background:row.c }}></div></div>
                  <div className="w-6 text-right font-bold" style={{ color: row.c }}>{row.v}</div>
                </div>
              ))}
            </div>
          </div>
          
          <div className="p-4 rounded-lg border bg-white shadow-sm" style={{ borderColor: C.line }}>
            <h3 className="font-bold text-sm mb-4" style={{ color: C.ink }}>예산집행률 분포</h3>
            <div className="flex flex-col gap-2.5 text-xs">
              {[
                { l: '90% 이상', v: sysStats.distB.h, c: '#22574A' },
                { l: '70~90%', v: sysStats.distB.m, c: '#C49A29' },
                { l: '70% 미만', v: sysStats.distB.l, c: '#C34B36' },
                { l: '미제출', v: sysStats.distB.n, c: '#9FA69E' },
                { l: '비예산', v: sysStats.distB.nb, c: '#C2BEAF' }
              ].map(row => (
                <div key={row.l} className="flex items-center gap-2">
                  <div className="w-16" style={{ color: C.muted }}>{row.l}</div>
                  <div className="flex-1 bg-gray-100 h-2.5 rounded-full overflow-hidden"><div className="h-full rounded-full transition-all" style={{ width:`${(row.v/sysStats.total)*100}%`, background:row.c }}></div></div>
                  <div className="w-6 text-right font-bold" style={{ color: row.c }}>{row.v}</div>
                </div>
              ))}
            </div>
          </div>
          
          <div className="p-4 rounded-lg border bg-white shadow-sm flex-1 flex flex-col" style={{ borderColor: C.line }}>
            <h3 className="font-bold text-sm mb-1" style={{ color: C.ink }}>관심 필요 사업 <span className="font-normal text-[11px] text-[#6B7169]">(달성률·집행률 70% 미만)</span></h3>
            <div className="flex-1 overflow-y-auto mt-2 pr-1" style={{ maxHeight: 220 }}>
              {sysStats.att.length === 0 ? <div className="text-xs text-[#6B7169] mt-2">해당 사업이 없습니다.</div> : sysStats.att.map(a => (
                <div key={a.id} className="p-2.5 mb-2 border rounded text-xs bg-white cursor-pointer hover:bg-gray-50 transition-colors" onClick={()=>onOpen(a.id, type)} style={{ borderColor: C.line }}>
                  <div className="font-bold text-[#1C201D] mb-1 truncate">{a.num} {a.name}</div>
                  <div className="text-[#C34B36] font-semibold flex gap-2">
                    {a.aR !== null && a.aR < 70 && <span>달성 {a.aR.toFixed(1)}%</span>}
                    {a.bR !== null && a.bR < 70 && <span>집행 {a.bR.toFixed(1)}%</span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ProjectInfoEdit({ p, disabled, onSave }) {
  const [open, setOpen] = useState(false);
  const [f, setF] = useState({});
  const [note, setNote] = useState("");
  useEffect(() => { setF({ dept: p.dept, team: p.team, officer: p.officer, goal: p.goal, unit: p.unit, budget: p.budget }); }, [p.id]);
  const dirty = ["dept", "team", "officer", "goal", "unit", "budget"].some((k) => (f[k] ?? "") !== (p[k] ?? ""));
  const save = () => {
    if (!dirty) return;
    onSave({ ...f, changeNote: note.trim() || "사유 미기재", changedAt: new Date().toISOString().slice(0, 10) });
    setNote(""); setOpen(false);
  };
  return (
    <div className="mb-5 rounded-md" style={{ border: `1px dashed ${C.gold}`, background: "#FDFBF4" }}>
      <button onClick={() => setOpen(!open)} className="w-full flex items-center justify-between px-4 py-2.5 text-sm font-bold" style={{ color: C.gold }}>
        <span>사업정보 수정 — 추경에 따른 예산·목표 변경, 담당 변경 시</span>
        <span>{open ? "닫기 ▲" : "열기 ▼"}</span>
      </button>
      {p.changedAt && !open && (
        <div className="px-4 pb-2 text-xs" style={{ color: C.muted }}>최근 변경 {p.changedAt} · {p.changeNote}</div>
      )}
      {open && (
        <div className="px-4 pb-4">
          <div className="grid grid-cols-2 md:grid-cols-3 gap-3 mb-3">
            <Field label="담당과"><IN value={f.dept} onChange={(v) => setF({ ...f, dept: v })} disabled={disabled} /></Field>
            <Field label="담당팀"><IN value={f.team} onChange={(v) => setF({ ...f, team: v })} disabled={disabled} /></Field>
            <Field label="담당자(연락처)"><IN value={f.officer} onChange={(v) => setF({ ...f, officer: v })} disabled={disabled} /></Field>
            <Field label="성과 목표값"><IN value={f.goal} onChange={(v) => setF({ ...f, goal: v })} disabled={disabled} /></Field>
            <Field label="단위"><IN value={f.unit} onChange={(v) => setF({ ...f, unit: v })} disabled={disabled} /></Field>
            <Field label="예산(백만원)" note="비예산 사업은 '비예산' 입력"><IN value={f.budget} onChange={(v) => setF({ ...f, budget: v })} disabled={disabled} /></Field>
          </div>
          <Field label="변경 사유" note="예: 제1회 추가경정예산 반영(예산 50→45), 조직개편에 따른 담당 변경 등">
            <IN value={note} onChange={setNote} disabled={disabled} placeholder="변경 사유를 기재하세요" />
          </Field>
          <div className="flex gap-2">
            <button onClick={save} disabled={disabled || !dirty} className="px-4 py-2 rounded-md text-sm font-bold text-white"
              style={{ background: disabled || !dirty ? C.muted : C.gold, cursor: disabled || !dirty ? "not-allowed" : "pointer" }}>변경 저장</button>
            <button onClick={() => { setF({ dept: p.dept, team: p.team, officer: p.officer, goal: p.goal, unit: p.unit, budget: p.budget }); setNote(""); }}
              className="px-4 py-2 rounded-md text-sm font-semibold" style={{ border: `1px solid ${C.line}`, color: C.ink }}>되돌리기</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Dashboard({ projects, evals, onOpen }) {
  const [q, setQ] = useState("");
  const [sys, setSys] = useState("all");
  const list = projects.filter((p) =>
    (sys === "all" || p.sys === sys) &&
    (q.trim() === "" || (p.name + p.num + p.dept + p.officer).includes(q.trim())));

  const cellOf = (pid, type) => {
    const g = evals[`${pid}::${type}::gonggong::gonggong`];
    const p = projects.find((x) => x.id === pid);
    const a = g ? pct(g.result, p.goal) : null;
    const b = g && p.budget !== "비예산" ? pct(g.spend, p.budget) : null;
    const nEval = ["monitor"].reduce((acc, grp) =>
      acc + Object.keys(evals).filter((k) => k.startsWith(`${pid}::${type}::${grp}::`)).length, 0);
    return { a, b, nEval, filled: !!g };
  };

  const filledCount = list.filter((p) => cellOf(p.id, "ihaeng").filled).length;

  return (
    <div>
      <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
        <div>
          <h2 className="text-lg font-bold" style={{ color: C.ink }}>사업별 모니터링 현황</h2>
          <p className="text-sm" style={{ color: C.muted }}>이행점검 공공입력 {filledCount}/{list.length} 건</p>
        </div>
        <div className="flex gap-2">
          <select value={sys} onChange={(e) => setSys(e.target.value)} className="rounded-md px-2 py-1.5 text-sm" style={{ border: `1px solid ${C.line}` }}>
            <option value="all">전체 전략체계</option>
            <option value="Ⅰ">전략체계 Ⅰ</option>
            <option value="Ⅱ">전략체계 Ⅱ</option>
          </select>
          <IN value={q} onChange={setQ} placeholder="사업명·부서·담당자 검색" w={220} />
        </div>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm" style={{ borderCollapse: "collapse", minWidth: 760 }}>
          <thead>
            <tr style={{ background: C.pineSoft }}>
              {["과제번호", "사업명 / 담당", "목표(지표)", "추진율", "집행율", "평가", "입력"].map((h) => (
                <th key={h} className="text-left px-3 py-2 whitespace-nowrap" style={{ color: C.pineDark }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {list.map((p) => {
              const ci = cellOf(p.id, "ihaeng");
              return (
                <tr key={p.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                  <td className="px-3 py-2 font-mono text-xs whitespace-nowrap">{p.num}{p.key && <div><Pill color={C.gold}>중점</Pill></div>}{p.changedAt && <div title={p.changeNote}><Pill color={C.ihaeng}>변경</Pill></div>}</td>
                  <td className="px-3 py-2">
                    <div className="font-semibold" style={{ color: C.ink }}>{p.name}</div>
                    <div className="text-xs" style={{ color: C.muted }}>{p.dept} · {p.team} · {p.officer}</div>
                  </td>
                  <td className="px-3 py-2 text-xs" style={{ color: C.muted, maxWidth: 180 }}>
                    <div className="font-semibold" style={{ color: C.ink }}>{p.goal} {p.unit}</div>
                    <div className="truncate" title={p.kpi}>{p.kpi}</div>
                  </td>
                  <td className="px-3 py-2 font-bold whitespace-nowrap" style={{ color: pctColor(ci.a) }}>{ci.a != null ? ci.a.toFixed(0) + "%" : "—"}</td>
                  <td className="px-3 py-2 font-bold whitespace-nowrap" style={{ color: pctColor(ci.b) }}>
                    {p.budget === "비예산" ? <span className="text-xs font-normal" style={{ color: C.muted }}>비예산</span> : ci.b != null ? ci.b.toFixed(0) + "%" : "—"}
                  </td>
                  <td className="px-3 py-2 text-xs whitespace-nowrap" style={{ color: C.muted }}>{ci.nEval}건</td>
                  <td className="px-3 py-2 whitespace-nowrap">
                    <button onClick={() => onOpen(p.id, "ihaeng")} className="px-2.5 py-1 rounded text-xs font-bold text-white mr-1" style={{ background: C.ihaeng }}>이행</button>
                    <button onClick={() => onOpen(p.id, "gyeolgwa")} className="px-2.5 py-1 rounded text-xs font-bold text-white" style={{ background: C.gyeolgwa }}>결과</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

  );
}

function GyeolgwaGonggong({ p, data, set, disabled }) {

  const achieve = pct(d.result, p.goal);
  const noBudget = p.budget === "비예산" || p.budget === "" || p.budget === "-";
  const execRate = noBudget ? null : pct(d.spend, p.budget);
  return (
    <div>
      <SectionLabel n="①" t="성과목표 현황 (12월말 기준)" />

        <span style={{ color: C.muted }}>추진실적</span>
        <IN type="number" value={d.result} onChange={(v) => u("result", v)} disabled={disabled} w={110} />
        <span style={{ color: C.muted }}>→ 달성률</span>
        <span className="font-bold" style={{ color: pctColor(achieve) }}>{achieve != null ? achieve.toFixed(1) + " %" : "—"}</span>
      </div>
      <SectionLabel n="②" t="예산집행 현황 (12월말 기준, 백만원)" />

        <div className="flex items-center gap-2 text-sm mb-4">
          <span style={{ color: C.muted }}>· 집행액</span>
          <IN type="number" value={d.spend} onChange={(v) => u("spend", v)} disabled={disabled} w={110} />
          <span style={{ color: C.muted }}>→ 집행률</span>
          <span className="font-bold" style={{ color: pctColor(execRate) }}>{execRate != null ? execRate.toFixed(1) + " %" : "—"}</span>
        </div>
      )}
      <SectionLabel n="③" t="추진상황" />

}

function ChecklistForm({ schemaKey, data, set, disabled }) {

function MonitorView({ projects, cfg, role, roleObj, me, setMe, sel, setSel, groupOfRole, periodOpen, evals, saveEvals, saveOverride }) {
  const [draft, setDraft] = useState(null);
  const project = sel && projects.find((p) => p.id === sel.pid);
  const needName = groupOfRole && groupOfRole !== "gonggong";
  const key = sel && groupOfRole ? `${sel.pid}::${sel.type}::${groupOfRole}::${groupOfRole === "gonggong" ? "gonggong" : (me.trim() || "익명")}` : null;

  useEffect(() => { setDraft(key ? (evals[key] || {}) : null); }, [key]);

  if (!sel) {
    return (
      <div>
        <h2 className="text-lg font-bold mb-2" style={{ color: C.ink }}>모니터링할 사업 선택</h2>
        <p className="text-sm mb-4" style={{ color: C.muted }}>대시보드에서 사업 행의 <b>이행</b>/<b>결과</b> 버튼으로 진입해도 됩니다.</p>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-2" style={{ maxHeight: 420, overflowY: "auto" }}>
          {projects.map((p) => (
            <div key={p.id} className="flex items-center justify-between rounded-md p-2.5" style={{ border: `1px solid ${C.line}` }}>
              <div className="min-w-0 pr-2">
                <div className="text-xs font-mono" style={{ color: C.muted }}>{p.num}</div>
                <div className="text-sm font-semibold truncate" style={{ color: C.ink }}>{p.name}</div>
              </div>
              <div className="shrink-0">
                <button onClick={() => setSel({ pid: p.id, type: "ihaeng" })} className="px-2 py-1 rounded text-xs font-bold text-white mr-1" style={{ background: C.ihaeng }}>이행</button>
                <button onClick={() => setSel({ pid: p.id, type: "gyeolgwa" })} className="px-2 py-1 rounded text-xs font-bold text-white" style={{ background: C.gyeolgwa }}>결과</button>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  const open = periodOpen(sel.type, groupOfRole);
  const disabled = !open;

  const handleSave = async () => {
    const d = draft || {};
    const noBudget = project.budget === "비예산" || !project.budget || project.budget === "-" || parseFloat(project.budget) === 0;

    const checkGen = (prefix, count) => {
      for(let i=0; i<count; i++) if (!d[`${prefix}_${i}`]) return false;
      return true;
    };

    let valid = true;

    if (groupOfRole === "gonggong") {
      if (sel.type === "ihaeng") {
        if (!d.type_key || !d.type_coop || !d.type_bal) valid = false;
        else if (!d.deg_plan) valid = false;
        else if ((d.deg_plan === 1 || d.deg_plan === 2) && !(d.reason_plan || "").trim()) valid = false;
        else if (d.result === undefined || d.result === "") valid = false;
        else if (!noBudget && !d.deg_budget) valid = false;
        else if (!noBudget && (d.deg_budget === 1 || d.deg_budget === 2) && !(d.reason_budget || "").trim()) valid = false;
        else if (!noBudget && (d.spend === undefined || d.spend === "")) valid = false;
        else if (!checkGen("gen", 13)) valid = false;
        else {
          const hasCh = ['ch_goal', 'ch_kpi', 'ch_budget', 'ch_content', 'ch_method', 'ch_etc'].some(k => d[k]);
          if (hasCh && !(d.ch_detail || "").trim()) valid = false;
          else if (!(d.op_perf || "").trim() || !(d.op_diff || "").trim() || !(d.op_improve || "").trim()) valid = false;
        }
      } else {
        if (d.result === undefined || d.result === "") valid = false;
        else if (!noBudget && (d.spend === undefined || d.spend === "")) valid = false;
        else if (!(d.g4 || "").trim()) valid = false;
      }
    } else {
      if (sel.type === "ihaeng") {
        if (!d.m_deg_plan || !d.m_deg_budget) valid = false;
        else if (!checkGen("m_gen", 13)) valid = false;
        else if (!(d.m_opinion || "").trim()) valid = false;
      } else {
        if (!checkGen("it", 6)) valid = false;
        else if (!(d.tx_0 || "").trim()) valid = false;
      }
    }

    if (!valid) {
      alert("입력되지 않은 항목이 있습니다. 모든 빈칸을 확인해주세요.");
      return;
    }

    await saveEvals(key, { ...draft, _updated: Date.now(), _by: role, _who: needName ? (me.trim() || "익명") : "공공" });
    setSel(null);
  };
  
  const gonggongKey = `${sel.pid}::${sel.type}::gonggong::gonggong`;
  const gonggongData = evals[gonggongKey];

  if (groupOfRole !== "gonggong") {
    return (
      <div>
        <BackBtn onClick={() => setSel(null)} />
        <div className="mb-4">
          <div className="flex items-center gap-2 flex-wrap mb-1">
            <Pill color={sel.type === "ihaeng" ? C.ihaeng : C.gyeolgwa}>{sel.type === "ihaeng" ? "이행점검" : "결과확인"}</Pill>
            <span className="text-xs font-mono" style={{ color: C.muted }}>{project.num}</span>
            {gonggongData ? <Pill color="#2E7D5B">담당자 자료 작성됨</Pill> : <Pill color="#B8860B">담당자 자료 미작성</Pill>}
            {!open && <Pill color={C.bad}>입력 기간 아님 (열람만 가능)</Pill>}
          </div>
          <h2 className="text-[22px] font-bold" style={{ color: C.ink }}>{project.name}</h2>
          <div className="text-xs mt-1" style={{ color: C.muted }}>{roleObj.label} · {roleObj.desc}</div>
        </div>

        {needName && (
          <div className="mb-4 max-w-sm">
            <label className="block text-sm font-bold mb-1.5" style={{ color: "#C34B36" }}>평가자 이름 / ID (이름을 먼저 입력해주세요)</label>
            <IN value={me} onChange={setMe} placeholder="예: 홍길동(분과명)" disabled={disabled} />
          </div>
        )}

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 items-start">
          <div className="border rounded-md shadow-sm flex flex-col" style={{ borderColor: C.line, background: "#FDFDFD", height: '700px' }}>
            <div className="p-3 border-b flex justify-between items-center" style={{ background: "#F4F7F6", borderColor: C.line }}>
              <span className="font-bold text-sm" style={{ color: C.ihaeng }}>📄 담당자 작성자료 <span className="font-normal text-xs text-gray-500">(열람 전용)</span></span>
              <span className="text-xs" style={{ color: C.muted }}>{cfg.asOf}</span>
            </div>
            <div className="p-5 overflow-y-auto flex-1 custom-scrollbar">
              <GonggongReadOnly p={project} data={gonggongData} asOf={cfg.asOf} type={sel.type} />
            </div>
          </div>

          <div className="border rounded-md shadow-sm flex flex-col bg-white" style={{ borderColor: C.line, height: '700px', opacity: needName && !me.trim() && !disabled ? 0.5 : 1, pointerEvents: needName && !me.trim() ? "none" : "auto" }}>
            <div className="p-3 border-b font-bold text-sm" style={{ background: "#F4F7F6", color: "#C34B36", borderColor: C.line }}>
              ✏️ 모니터링단 평가 입력
            </div>
            <div className="p-5 overflow-y-auto flex-1 custom-scrollbar">
              {sel.type === "ihaeng"
                ? <MonitorChecklistForm p={project} data={draft} set={setDraft} disabled={disabled} />
                : <ChecklistForm schemaKey={`${sel.type}:${groupOfRole}`} data={draft} set={setDraft} disabled={disabled} />
              }
            </div>
            <div className="p-3 border-t bg-gray-50 flex items-center justify-between" style={{ borderColor: C.line }}>
              {needName && !me.trim() && !disabled ? (
                <span className="text-sm font-bold ml-2" style={{ color: C.bad }}>평가자 이름을 먼저 입력하세요.</span>
              ) : (
                <span className="text-xs text-gray-500 ml-2">모든 항목을 확인 후 저장해주세요.</span>
              )}
              <div className="flex gap-2">
                <button onClick={() => setSel(null)} className="px-4 py-2 rounded-md text-sm font-semibold bg-white shadow-sm" style={{ border: `1px solid ${C.line}`, color: C.ink }}>취소</button>
                <button onClick={handleSave} disabled={disabled || (needName && !me.trim())} className="px-6 py-2 rounded-md text-sm font-bold text-white shadow-sm transition-colors"
                  style={{ background: disabled || (needName && !me.trim()) ? C.muted : C.pine, cursor: disabled ? "not-allowed" : "pointer" }}>저장</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      <BackBtn onClick={() => setSel(null)} />
      <div className="mb-4">
        <div className="flex items-center gap-2 flex-wrap">
          <Pill color={sel.type === "ihaeng" ? C.ihaeng : C.gyeolgwa}>{sel.type === "ihaeng" ? "이행점검" : "결과확인"}</Pill>
          <span className="text-xs font-mono" style={{ color: C.muted }}>{project.num}</span>
          {!open && <Pill color={C.bad}>입력 기간 아님 (열람만 가능)</Pill>}
        </div>
        <h2 className="text-lg font-bold mt-1" style={{ color: C.ink }}>{project.name}</h2>
        <div className="text-xs" style={{ color: C.muted }}>{roleObj.label} · {roleObj.desc}</div>
      </div>

      <ProjectInfoEdit p={project} disabled={disabled} onSave={(patch) => saveOverride(project.id, patch)} />

      <div>
        {sel.type === "ihaeng"
          ? <SeoguChecklist p={project} data={draft} set={setDraft} disabled={disabled} asOf={cfg.asOf} />
          : <GyeolgwaGonggong p={project} data={draft} set={setDraft} disabled={disabled} />
        }
      </div>

      <div className="flex gap-2 mt-6">
        <button onClick={handleSave} disabled={disabled} className="px-5 py-2.5 rounded-md text-sm font-bold text-white"
          style={{ background: disabled ? C.muted : C.pine, cursor: disabled ? "not-allowed" : "pointer" }}>저장</button>
        <button onClick={() => setSel(null)} className="px-5 py-2.5 rounded-md text-sm font-semibold" style={{ border: `1px solid ${C.line}`, color: C.ink }}>목록으로</button>
      </div>
    </div>
  );
}

function Evidence({ projects }) {
  const [evidences, setEvidences] = useState([]);
  const [selProject, setSelProject] = useState("");
  const [type, setType] = useState("성과지표 근거자료");
  const [title, setTitle] = useState("");
  const [uploader, setUploader] = useState("");
  const [regMode, setRegMode] = useState("file");
  const [selectedFile, setSelectedFile] = useState(null);
  const [linkUrl, setLinkUrl] = useState("");
  const [uploading, setUploading] = useState(false);

  useEffect(() => {
    const unsub = db.collection("evidences").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
      const list = [];
      snapshot.forEach((doc) => {
        list.push({ id: doc.id, ...doc.data() });
      });
      setEvidences(list);
    });
    return () => unsub();
  }, []);

  const resetForm = () => {
    setTitle("");
    setLinkUrl("");
    setSelectedFile(null);
    const fileInput = document.getElementById("evidence_file_input");
    if (fileInput) fileInput.value = "";
  };

  const handleAdd = async () => {
    if (!selProject) {
      alert("대상 사업을 선택해주세요.");
      return;
    }
    const p = projects.find(x => x.name === selProject);

    if (regMode === "file") {
      if (!selectedFile) {
        alert("첨부할 파일을 선택해주세요.");
        return;
      }
      setUploading(true);
      try {
        const fileRef = storage.ref(`evidences/${Date.now()}_${selectedFile.name}`);
        const snapshot = await fileRef.put(selectedFile);
        const downloadUrl = await snapshot.ref.getDownloadURL();

        await db.collection("evidences").add({
          pNum: p ? p.num : "-",
          pName: selProject,
          type: type,
          title: title || selectedFile.name,
          regMode: "file",
          downloadUrl: downloadUrl,
          storagePath: fileRef.fullPath,
          fileDesc: `${selectedFile.name} · ${(selectedFile.size / 1024).toFixed(0)}KB`,
          uploader: uploader || "담당자",
          date: new Date().toISOString().slice(0, 10),
          createdAt: Date.now()
        });
        resetForm();
        alert("증빙자료가 클라우드에 성공적으로 등록되었습니다.");
      } catch (err) {
        alert("업로드 중 오류 발생: " + err.message);
      } finally {
        setUploading(false);
      }
    } else {
      if (!linkUrl) {
        alert("공유 링크 주소를 입력해주세요.");
        return;
      }
      try {
        await db.collection("evidences").add({
          pNum: p ? p.num : "-",
          pName: selProject,
          type: type,
          title: title || "공유 링크 자료",
          regMode: "link",
          downloadUrl: linkUrl,
          fileDesc: "",
          uploader: uploader || "담당자",
          date: new Date().toISOString().slice(0, 10),
          createdAt: Date.now()
        });
        resetForm();
        alert("공유 링크가 성공적으로 등록되었습니다.");
      } catch (err) {
        alert("등록 중 오류 발생: " + err.message);
      }
    }
  };

  const handleDelete = async (ev) => {
    if (!confirm("해당 증빙자료를 삭제하시겠습니까?")) return;
    try {
      if (ev.storagePath) {
        await storage.ref(ev.storagePath).delete().catch(() => {});
      }
      await db.collection("evidences").doc(ev.id).delete();
      alert("삭제되었습니다.");
    } catch (err) {
      alert("삭제 중 오류 발생: " + err.message);
    }
  };

  return (
    <div>

function SummaryAggregate({ projects, evals }) {
  const [type, setType] = useState("ihaeng");

  const aggregatedData = useMemo(() => {
    const list = [];
    projects.forEach((p) => {
      const evalKeys = Object.keys(evals).filter(k => k.startsWith(`${p.id}::${type}::monitor::`));
      if (evalKeys.length === 0) return;

      let cnt = evalKeys.length;
      if (type === "ihaeng") {
        let sumPlan = 0, sumBdg = 0, sumGen = 0, genCnt = 0;
        evalKeys.forEach(k => {
          const item = evals[k] || {};
          if (item.m_deg_plan) sumPlan += Number(item.m_deg_plan);
          if (item.m_deg_budget) sumBdg += Number(item.m_deg_budget);
          for (let i = 0; i < 13; i++) {
            if (item["m_gen_" + i]) {
              sumGen += Number(item["m_gen_" + i]);
              genCnt++;
            }
          }
        });
        const avgPlan = (sumPlan / cnt) || 0;
        const avgBdg = (sumBdg / cnt) || 0;
        const avgGen = genCnt > 0 ? (sumGen / genCnt) : 0;
        const totalAvg = ((avgPlan + avgBdg + avgGen) / 3) || 0;

        list.push({ id: p.id, num: p.num, name: p.name, cnt, avgPlan: avgPlan.toFixed(2), avgBdg: avgBdg.toFixed(2), avgGen: avgGen.toFixed(2), totalAvg: totalAvg.toFixed(2) });
      } else {
        let sumItems = 0, itemCnt = 0;
        evalKeys.forEach(k => {
          const item = evals[k] || {};
          for (let i = 0; i < 6; i++) {
            if (item["it_" + i]) {
              sumItems += Number(item["it_" + i]);
              itemCnt++;
            }
          }
        });
        const totalAvg = itemCnt > 0 ? (sumItems / itemCnt) : 0;
        list.push({ id: p.id, num: p.num, name: p.name, cnt, totalAvg: totalAvg.toFixed(2) });
      }
    });
    return list;
  }, [projects, evals, type]);

  return (
    <div>
      <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
        <div>
          <h2 className="text-xl font-bold" style={{ color: C.ink }}>평가표 집계 <span className="text-sm font-normal text-[#6B7169]">(평균·참여인원 / 공공 자체점검 제외)</span></h2>
        </div>
        <div className="flex border rounded-md overflow-hidden" style={{ borderColor: C.line }}>
          <button onClick={() => setType('ihaeng')} className={`px-4 py-1.5 text-sm font-bold transition-colors ${type === 'ihaeng' ? 'bg-[#22574A] text-white' : 'bg-white text-[#6B7169]'}`}>이행점검</button>
          <button onClick={() => setType('gyeolgwa')} className={`px-4 py-1.5 text-sm font-bold transition-colors ${type === 'gyeolgwa' ? 'bg-[#22574A] text-white' : 'bg-white text-[#6B7169]'}`}>결과확인</button>
        </div>
      </div>

      {aggregatedData.length === 0 ? (
        <div className="p-6 rounded-md text-sm text-[#4A6B5D] bg-[#EAF2ED] mb-4">아직 평가단 입력이 없습니다. 평가가 저장되면 사업별 평균이 여기에 집계됩니다.</div>
      ) : (
        <div className="overflow-x-auto mb-4 bg-white border rounded-md" style={{ borderColor: C.line }}>
          <table className="w-full text-sm" style={{ borderCollapse: "collapse", minWidth: 700 }}>
            <thead>
              <tr style={{ background: C.pineSoft }}>
                <th className="text-left px-3 py-2 w-24" style={{ color: C.pineDark }}>과제번호</th>
                <th className="text-left px-3 py-2" style={{ color: C.pineDark }}>사업명</th>
                <th className="text-center px-3 py-2 w-20" style={{ color: C.pineDark }}>참여인원</th>
                {type === "ihaeng" ? (
                  <>
                    <th className="text-center px-3 py-2 w-28" style={{ color: C.pineDark }}>사업계획 이행</th>
                    <th className="text-center px-3 py-2 w-28" style={{ color: C.pineDark }}>예산집행 이행</th>
                    <th className="text-center px-3 py-2 w-28" style={{ color: C.pineDark }}>전반적 점검</th>
                    <th className="text-center px-3 py-2 w-24 font-bold" style={{ color: C.pineDark }}>종합 평균</th>
                  </>
                ) : (
                  <th className="text-center px-3 py-2 w-32 font-bold" style={{ color: C.pineDark }}>종합 평균 (상3·중2·하1)</th>
                )}
              </tr>
            </thead>
            <tbody>
              {aggregatedData.map((row) => (
                <tr key={row.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                  <td className="px-3 py-2.5 font-mono text-xs font-semibold" style={{ color: C.muted }}>{row.num}</td>
                  <td className="px-3 py-2.5 font-medium" style={{ color: C.ink }}>{row.name}</td>
                  <td className="px-3 py-2.5 text-center font-bold" style={{ color: C.pine }}>{row.cnt}명</td>
                  {type === "ihaeng" ? (
                    <>
                      <td className="px-3 py-2.5 text-center">{row.avgPlan}점</td>
                      <td className="px-3 py-2.5 text-center">{row.avgBdg}점</td>
                      <td className="px-3 py-2.5 text-center">{row.avgGen}점</td>
                      <td className="px-3 py-2.5 text-center font-bold text-blue-700 bg-blue-50/50">{row.totalAvg}점</td>
                    </>
                  ) : (
                    <td className="px-3 py-2.5 text-center font-bold text-blue-700 bg-blue-50/50">{row.totalAvg}점</td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function ReportGenerator({ projects, evals }) {
  const [type, setType] = useState("ihaeng");

  const reportData = useMemo(() => {
    let total = projects.length;
    let submitted = 0;
    let sumAch = 0, cntAch = 0;
    let sumBdg = 0, sumSpd = 0;
    let stgMap = {};
    let changedProjects = [];

    projects.forEach(p => {
      const gKey = `${p.id}::${type}::gonggong::gonggong`;
      const gData = evals[gKey];
      const has = !!gData;
      if (has) submitted++;

      const stKey = p.num.split('-').slice(0, 2).join('-');
      const stName = STRATEGY_NAMES[stKey] || `추진전략 ${stKey}`;
      if (!stgMap[stKey]) stgMap[stKey] = { id: stKey, name: stName, cnt: 0, sub: 0, aS: 0, aC: 0, bS: 0, sS: 0 };
      stgMap[stKey].cnt++;
      if (has) stgMap[stKey].sub++;

      let aR = null;
      const goal = parseFloat(p.goal);
      if (has && !isNaN(goal) && goal > 0) {
        const r = parseFloat(gData.result);
        if (!isNaN(r)) {
          aR = (r / goal) * 100;
          sumAch += Math.min(aR, 100);
          cntAch++;
          stgMap[stKey].aS += Math.min(aR, 100);
          stgMap[stKey].aC++;
        }
      }

      const nb = p.budget === "비예산" || !p.budget || p.budget == "0" || p.budget == 0;
      if (!nb) {
        const bdg = parseFloat(p.budget);
        sumBdg += bdg;
        stgMap[stKey].bS += bdg;
        if (has) {
          const spd = parseFloat(gData.spend);
          if (!isNaN(spd)) {
            sumSpd += spd;
            stgMap[stKey].sS += spd;
          }
        }
      }

      if (has) {
        const changes = [];
        if (gData.ch_goal) changes.push("목표");
        if (gData.ch_kpi) changes.push("성과지표");
        if (gData.ch_budget) changes.push("예산");
        if (gData.ch_content) changes.push("사업내용");
        if (gData.ch_method) changes.push("수행방법");
        if (gData.ch_etc) changes.push("기타");
        if (changes.length > 0 || p.changedAt) {
          changedProjects.push({ ...p, changes, changeNote: p.changeNote || gData.ch_detail });
        }
      }
    });

    const strategies = Object.values(stgMap).sort((a, b) => a.id.localeCompare(b.id));
    const avgAch = cntAch ? sumAch / cntAch : 0;
    const avgBdg = sumBdg ? (sumSpd / sumBdg) * 100 : 0;

    return { total, submitted, avgAch, sumBdg, sumSpd, avgBdg, strategies, changedProjects };
  }, [projects, evals, type]);

  return (
    <div>
      <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-6 no-print">
        <div>
          <h2 className="text-xl font-bold" style={{ color: C.ink }}>핵심 분석 결과보고서</h2>
          <p className="text-sm text-[#6B7169]">공공 입력 및 모니터링 데이터를 기반으로 자동 생성된 종합 분석 보고서입니다.</p>
        </div>
        <div className="flex items-center gap-3">
          <div className="flex border rounded-md overflow-hidden bg-white" style={{ borderColor: C.line }}>
            <button onClick={() => setType("ihaeng")} className={`px-4 py-1.5 text-sm font-bold transition-colors ${type === "ihaeng" ? 'bg-[#005BAA] text-white' : 'text-[#6B7169]'}`}>이행점검</button>
            <button onClick={() => setType("gyeolgwa")} className={`px-4 py-1.5 text-sm font-bold transition-colors ${type === "gyeolgwa" ? 'bg-[#005BAA] text-white' : 'text-[#6B7169]'}`}>결과확인</button>
          </div>
          <button onClick={() => window.print()} className="px-4 py-1.5 rounded-md text-sm font-bold text-white shadow-sm flex items-center gap-1.5" style={{ background: C.pineDark }}>
            🖨️ 보고서 인쇄 (PDF 저장)
          </button>
        </div>
      </div>

      {/* 인쇄용 리포트 박스 */}
      <div className="p-8 rounded-lg bg-white border shadow-sm report-box space-y-8" style={{ borderColor: C.line, fontFamily: "'Pretendard','Malgun Gothic',sans-serif" }}>
        
        {/* 리포트 헤더 */}
        <div className="text-center pb-6 border-b-2" style={{ borderColor: C.pineDark }}>
          <div className="text-xs font-bold tracking-widest mb-1" style={{ color: C.pine }}>대구광역시 제5기 지역사회보장계획</div>
          <h1 className="text-2xl font-bold mb-2" style={{ color: C.ink }}> 2026년 연차별 시행계획<br/>{type === 'ihaeng' ? '이행점검' : '결과확인'} 종합 분석 결과보고서</h1>
          <div className="text-xs text-[#6B7169]">발행일: 2026년 8월 27일 · 기준: 2026. 7. 31 기준</div>
        </div>

        {/* 1. 추진 개요 및 요약 */}
        <div>
          <h3 className="text-base font-bold mb-3 pb-1" style={{ color: C.pine, borderBottom: `2px solid ${C.pineSoft}` }}>1. 전체 추진 개요 및 핵심 요약</h3>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4 p-4 rounded-md bg-[#FAF9F4] border text-sm" style={{ borderColor: C.line }}>
            <div>
              <span className="text-xs text-[#6B7169] block">전체 세부사업</span>
              <span className="text-lg font-bold">{reportData.total}개 사업</span>
            </div>
            <div>
              <span className="text-xs text-[#6B7169] block">공공 점검자료 제출</span>
              <span className="text-lg font-bold text-[#005BAA]">{reportData.submitted}개 ({Math.round((reportData.submitted/reportData.total)*100)}%)</span>
            </div>
            <div>
              <span className="text-xs text-[#6B7169] block">평균 목표달성률</span>
              <span className="text-lg font-bold text-[#B8860B]">{reportData.avgAch.toFixed(1)}%</span>
            </div>
            <div>
              <span className="text-xs text-[#6B7169] block">예산 집행률(총액)</span>
              <span className="text-lg font-bold text-[#B8860B]">{reportData.avgBdg.toFixed(1)}%</span>
            </div>
          </div>
        </div>

        {/* 2. 추진전략 단위별 현황 */}
        <div>
          <h3 className="text-base font-bold mb-3 pb-1" style={{ color: C.pine, borderBottom: `2px solid ${C.pineSoft}` }}>2. 추진전략 단위별 성과 분석</h3>
          <div className="overflow-x-auto">
            <table className="w-full text-sm border-collapse" style={{ borderColor: C.line }}>
              <thead>
                <tr style={{ background: C.pineSoft }}>
                  <th className="text-left p-2.5 border" style={{ borderColor: C.line, color: C.pineDark }}>전략코드</th>
                  <th className="text-left p-2.5 border" style={{ borderColor: C.line, color: C.pineDark }}>추진전략명</th>
                  <th className="text-center p-2.5 border w-20" style={{ borderColor: C.line, color: C.pineDark }}>사업수</th>
                  <th className="text-center p-2.5 border w-20" style={{ borderColor: C.line, color: C.pineDark }}>제출수</th>
                  <th className="text-center p-2.5 border w-28" style={{ borderColor: C.line, color: C.pineDark }}>평균 달성률</th>
                  <th className="text-center p-2.5 border w-28" style={{ borderColor: C.line, color: C.pineDark }}>예산 집행률</th>
                </tr>
              </thead>
              <tbody>
                {reportData.strategies.map(stg => {
                  const aRate = stg.aC ? stg.aS / stg.aC : 0;
                  const bRate = stg.bS ? (stg.sS / stg.bS) * 100 : 0;
                  return (
                    <tr key={stg.id} className="border-b" style={{ borderColor: C.line }}>
                      <td className="p-2.5 border font-mono font-bold" style={{ borderColor: C.line }}>{stg.id}</td>
                      <td className="p-2.5 border font-medium" style={{ borderColor: C.line }}>{stg.name}</td>
                      <td className="p-2.5 border text-center" style={{ borderColor: C.line }}>{stg.cnt}</td>
                      <td className="p-2.5 border text-center font-bold text-[#005BAA]" style={{ borderColor: C.line }}>{stg.sub}</td>
                      <td className="p-2.5 border text-center font-bold" style={{ borderColor: C.line, color: pctColor(aRate) }}>{aRate.toFixed(1)}%</td>
                      <td className="p-2.5 border text-center font-bold" style={{ borderColor: C.line, color: pctColor(bRate) }}>{stg.bS ? bRate.toFixed(1) + '%' : '비예산'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>

        {/* 3. 사업계획 변경 필요 현황 */}
        <div>
          <h3 className="text-base font-bold mb-3 pb-1" style={{ color: C.pine, borderBottom: `2px solid ${C.pineSoft}` }}>3. 사업계획 변경 및 특이사항 사업 요약</h3>
          {reportData.changedProjects.length === 0 ? (
            <div className="p-4 rounded-md text-sm text-[#6B7169] bg-[#FAF9F4] border" style={{ borderColor: C.line }}>변경 사항이 입력된 사업이 없습니다.</div>
          ) : (
            <div className="overflow-x-auto">
              <table className="w-full text-sm border-collapse" style={{ borderColor: C.line }}>
                <thead>
                  <tr style={{ background: C.pineSoft }}>
                    <th className="text-left p-2.5 border w-24" style={{ borderColor: C.line, color: C.pineDark }}>과제번호</th>
                    <th className="text-left p-2.5 border" style={{ borderColor: C.line, color: C.pineDark }}>세부사업명</th>
                    <th className="text-left p-2.5 border w-36" style={{ borderColor: C.line, color: C.pineDark }}>변경 영역</th>
                    <th className="text-left p-2.5 border" style={{ borderColor: C.line, color: C.pineDark }}>변경 사유 및 내용</th>
                  </tr>
                </thead>
                <tbody>
                  {reportData.changedProjects.map(cp => (
                    <tr key={cp.id} className="border-b" style={{ borderColor: C.line }}>
                      <td className="p-2.5 border font-mono text-xs font-bold" style={{ borderColor: C.line }}>{cp.num}</td>
                      <td className="p-2.5 border font-semibold" style={{ borderColor: C.line }}>{cp.name}</td>
                      <td className="p-2.5 border text-xs font-bold text-[#B8860B]" style={{ borderColor: C.line }}>{cp.changes.join(', ') || '정보 수정'}</td>
                      <td className="p-2.5 border text-xs" style={{ borderColor: C.line }}>{cp.changeNote || '사유 미기재'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>

        {/* 종합 제언 */}
        <div className="p-4 rounded-md bg-[#FAF9F4] border text-sm" style={{ borderColor: C.line }}>
          <h4 className="font-bold mb-1.5" style={{ color: C.pineDark }}>💡 종합 분석 및 제언</h4>
          <p className="text-xs leading-relaxed text-[#6B7169]">
            본 보고서는 2026년도 지역사회보장계획 이행상황을 점검한 결과로, 전반적인 목표달성률은 양호하나 일부 예산 집행 부진 사업 및 성과지표 미달성 사업에 대한 하반기 집중 모니터링과 개선 조치가 필요합니다. 변경이 요구되는 사업은 신속하게 추경 및 계획 변경 절차를 거쳐 사업 실효성을 제고해야 합니다.
          </p>
        </div>

      </div>
    </div>
  );
}

function App() {
  const [cfg, setCfg] = useState(DEFAULT_CFG);
  const [evals, setEvals] = useState({});
  const [loading, setLoading] = useState(true);
  const [role, setRole] = useState(null);
  const [me, setMe] = useState("");
  const [view, setView] = useState("summary");
  const [sel, setSel] = useState(null);
  const [toast, setToast] = useState("");

  const projects = useMemo(() =>
    PROJECTS_RAW.map((p) => ({ ...p, ...(cfg.overrides[p.id] || {}) })), [cfg.overrides]);

  useEffect(() => {
    const unsubCfg = db.collection("settings").doc("config").onSnapshot((doc) => {
      if (doc.exists) setCfg(prev => ({ ...prev, ...doc.data() }));
    });

    const unsubEvals = db.collection("evals").onSnapshot((snapshot) => {
      const next = {};
      snapshot.forEach(doc => { next[doc.id] = doc.data(); });
      setEvals(next);
      setLoading(false);
    });

    return () => { unsubCfg(); unsubEvals(); };
  }, []);

  const flash = (m) => { setToast(m); setTimeout(() => setToast(""), 1800); };
  
  const saveCfg = useCallback(async (next) => {
    setCfg(next);
    await db.collection("settings").doc("config").set(next, { merge: true });
    flash("설정이 동기화되었습니다");
  }, []);

  const saveEvals = useCallback(async (key, patch) => {
    await db.collection("evals").doc(key).set(patch, { merge: true });
    flash("클라우드에 저장되었습니다");
  }, []);

  const saveOverride = useCallback(async (pid, patch) => {
    const nextOverrides = { ...(cfg.overrides || {}), [pid]: { ...(cfg.overrides?.[pid] || {}), ...patch } };
    const nextCfg = { ...cfg, overrides: nextOverrides };
    setCfg(nextCfg);
    await db.collection("settings").doc("config").set({ overrides: nextOverrides }, { merge: true });
    flash("사업정보가 변경되었습니다");
  }, [cfg]);

  if (loading) return <div className="p-10 text-center font-bold" style={{ color: C.muted }}>클라우드 데이터를 불러오는 중…</div>;

  if (!role) {
    return <LoginScreen onLogin={(r) => { setRole(r); setSel(null); setView("summary"); }} />;
  }

  const roleObj = ROLES.find((r) => r.id === role) || ROLES[1];
  const groupOfRole = role === "gonggong" ? "gonggong" : role === "monitor" ? "monitor" : "gonggong";
  const periodOpen = (type, group) => group === "gonggong" ? cfg.periods[`${type}_gonggong`] : cfg.periods[`${type}_eval`];

  const tabs = [
    { id: "summary", l: "종합 대시보드" },
    { id: "dash", l: "사업별 현황" },
    ...(role !== "admin" ? [{ id: "monitor", l: "모니터링 입력" }] : []),
    { id: "evidence", l: "증빙자료" },
    ...(role === "admin" ? [
      { id: "admin", l: "관리자" }, 
      { id: "aggregate", l: "집계 결과" },
      { id: "report", l: "결과보고서" }
    ] : []),
  ];

  return (
    <div style={{ background: C.paper, minHeight: "100vh", fontFamily: "'Pretendard','Apple SD Gothic Neo','Malgun Gothic',-apple-system,sans-serif" }}>
      <header style={{ background: C.pineDark }} className="text-white no-print">
        <div className="max-w-6xl mx-auto px-5 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div>
            <div className="text-[11px] tracking-widest font-semibold" style={{ color: "#9DBBB0" }}>대구광역시 제5기 지역사회보장계획</div>
            <h1 className="text-lg md:text-xl font-bold mt-0.5">지역사회보장계획 온라인 모니터링 시스템</h1>
          </div>
          <div className="flex items-center gap-3">
            <div className="px-3 py-1 rounded-full text-xs font-bold" style={{ background: "rgba(255,255,255,0.2)", color: "#fff" }}>
              접속 중: {roleObj.label}
            </div>
            <button onClick={() => setRole(null)} className="text-xs transition-colors hover:text-white underline" style={{ color: "#9DBBB0" }}>
              로그아웃
            </button>
          </div>
        </div>
      </header>

      <div style={{ background: C.pine }} className="text-white no-print">
        <div className="max-w-6xl mx-auto px-5 py-3">
          <div className="text-[11px] font-semibold mb-1.5" style={{ color: "#C6DAD1" }}>{cfg.planTitle}</div>
        </div>
      </div>

      <nav className="max-w-6xl mx-auto px-5 pt-4 no-print">
        <div className="flex gap-1 flex-wrap">
          {tabs.map((t) => (
            <button key={t.id} onClick={() => { setView(t.id); if (t.id !== "monitor") setSel(null); }}
              className="px-4 py-2 text-sm font-semibold rounded-t-md"
              style={{ background: view === t.id ? C.surface : "transparent", color: view === t.id ? C.pine : C.muted, border: view === t.id ? `1px solid ${C.line}` : "1px solid transparent", borderBottom: view === t.id ? `1px solid ${C.surface}` : "1px solid transparent", marginBottom: -1 }}>
              {t.l}
            </button>
          ))}
        </div>
      </nav>

      <main className="max-w-6xl mx-auto px-5 pb-16 pt-3 md:pt-0">
        <div style={{ background: C.surface, border: `1px solid ${C.line}` }} className="rounded-lg md:rounded-tl-none p-5 md:p-7 shadow-sm">
          {view === "summary" && <SummaryDashboard projects={projects} evals={evals} onOpen={(pid, type) => { setSel({ pid, type }); setView("monitor"); }} />}
          {view === "dash" && <Dashboard projects={projects} evals={evals} onOpen={(pid, type) => { setSel({ pid, type }); setView("monitor"); }} />}
          {view === "monitor" && role !== "admin" && <MonitorView projects={projects} cfg={cfg} role={role} roleObj={roleObj} me={me} setMe={setMe} sel={sel} setSel={setSel} groupOfRole={groupOfRole} periodOpen={periodOpen} evals={evals} saveEvals={saveEvals} saveOverride={saveOverride} />}
          {view === "evidence" && <Evidence projects={projects} />}
          {view === "admin" && role === "admin" && <Admin cfg={cfg} saveCfg={saveCfg} />}
          {view === "aggregate" && role === "admin" && <SummaryAggregate projects={projects} evals={evals} />}
          {view === "report" && role === "admin" && <ReportGenerator projects={projects} evals={evals} />}
        </div>
      </main>

      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-md text-sm font-semibold text-white shadow-lg no-print" style={{ background: C.pineDark }}>{toast}</div>}
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script></body></html>
